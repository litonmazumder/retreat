services:

  app:
    build: .
    container_name: retreat-app
    restart: unless-stopped
    working_dir: /var/www

    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/uploads.ini

    networks:
      - laravel

  nginx:
    image: nginx:alpine
    container_name: retreat-app-nginx
    restart: unless-stopped

    ports:
      - "8002:80"
      - "5174:5173"

    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - laravel

  queue:
    build: .
    container_name: retreat-app-queue
    restart: unless-stopped
    working_dir: /var/www

    volumes:
      - .:/var/www
      - ./docker/supervisor/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf

    command:
      - /usr/bin/supervisord
      - -n

    depends_on:
      - app

    networks:
      - laravel

networks:
  laravel:
    driver: bridge
